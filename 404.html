<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("cv-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    :root { color-scheme: light; --bg: #f6f5f1; --text: #191a1c; --muted: #55585d; --accent: #0f766e; --accent-contrast: #fff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0e1012; --text: #ecebe6; --muted: #a8aaad; --accent: #2dd4bf; --accent-contrast: #04211e; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0e1012; --text: #ecebe6; --muted: #a8aaad; --accent: #2dd4bf; --accent-contrast: #04211e; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; text-align: center;
    }
    .code { margin: 0; font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; color: var(--accent); }
    h1 { margin: 14px 0 8px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; letter-spacing: -.03em; }
    p { margin: 0 0 28px; color: var(--muted); }
    a { display: inline-block; padding: 12px 18px; border-radius: 10px; background: var(--accent); color: var(--accent-contrast); font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken or the page may have moved.</p>
    <a id="home" href="/">Back to the CV</a>
  </main>
  <script>
    // Project sites live under /<repository>/, so link to that folder when we're in it.
    var first = location.pathname.split("/")[1];
    if (location.hostname.endsWith("github.io") && first && first.indexOf(".") === -1 && first === "fazekascsaba") {
      document.getElementById("home").setAttribute("href", "/" + first + "/");
    }
  </script>
</body>
</html>
